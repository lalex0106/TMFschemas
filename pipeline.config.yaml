# 企业级 schema 构建流水线配置
sources:
  tmf_official: sources/tmf-official
  external: sources/external
processing:
  common_candidate_threshold: 12
  filename_regex: '^(TMF\d+).*?(v\d+\.\d+\.\d+)'
  prefer_existing_domains: true
  default_domain: Unclassified
  allowed_major_versions:
    - v4
    - v5
output:
  root: dist/json
  docs: dist/docs
  yaml: dist/yaml
  validation:
    root: dist/validation
    strip_extensions:
      - x-metadata
      - x-i18n
      - x-*
metadata:
  domain_mapping_file: config/domain_mapping.yaml
  api_name_mapping_file: config/apiname_mapping.yaml
  schema_taxonomy_file: config/schema_taxonomy.yaml
  schema_draft: 'http://json-schema.org/draft-07/schema#'
i18n:
  default_locale: en
  output_key: x-i18n
  locales:
    - code: zh-CN
      path: overrides/i18n/zh-CN
