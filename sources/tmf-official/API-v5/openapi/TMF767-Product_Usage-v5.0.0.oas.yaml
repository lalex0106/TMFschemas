openapi: 3.0.1
info:
  title: Product Usage Management
  description: >-
    TMF767 Product Usage Management provides a standaised mechanism for usage management such as
    creation, update, retrieval, import and export of a collection of product usage. A Product usage
    represents is an occurrence of usage on a Product derived from various Service usages, which can
    be further used to generate interest to a billing system, and can have charges applied to it. It
    is comprised of characteristics which define all attributes known for a particular type of
    Product usage.
  version: 5.0.0
servers:
  - url: '{apiRoot}/tmf-api/productUsageManagement/v5/'
    variables:
      apiRoot:
        default: 'http://serverRoot'
        enum:
          - 'http://serverRoot'
tags:
  - name: productUsage
    description: Operations for ProductUsage Resource
  - name: productUsageSpecification
    description: Operations for ProductUsageSpecification Resource
  - name: notification listener
    description: Notifications for Resource Lifecycle and event notifications
  - name: events subscription
    description: Endpoints to register and terminate an Event Listener
paths:
  /hub:
    post:
      operationId: createHub
      summary: Create a subscription (hub) to receive Events
      description: Sets the communication endpoint to receive Events.
      tags:
        - events subscription
      requestBody:
        $ref: '#/components/requestBodies/Hub_FVO'
      responses:
        '201':
          $ref: '#/components/responses/Hub'
        default:
          $ref: '#/components/responses/Error'
  '/hub/{id}':
    get:
      operationId: hubGet
      summary: Retrieve a subscription (hub)
      description: ''
