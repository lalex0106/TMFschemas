components:
  schemas:
    ActualCost:
      allOf:
        - $ref: '#/components/schemas/Cost'
        - type: object
          description: 'Concrete implementation of Cost, as ActualCost'
          properties:
            state:
              $ref: '#/components/schemas/ActualCostStateType'
            period:
              $ref: '#/components/schemas/TimePeriod'
            actualCostItem:
              type: array
              description: A list of Actual Cost Items items which are part of the overall Actual cost
              items:
                $ref: '#/components/schemas/ActualCostItem'
    ActualCost_FVO:
      allOf:
        - $ref: '#/components/schemas/Cost_FVO'
        - type: object
          description: 'Concrete implementation of Cost, as ActualCost'
          properties:
            state:
              $ref: '#/components/schemas/ActualCostStateType'
            period:
              $ref: '#/components/schemas/TimePeriod'
            actualCostItem:
              type: array
              description: A list of Actual Cost Items items which are part of the overall Actual cost
              items:
                $ref: '#/components/schemas/ActualCostItem_FVO'
          required:
            - actualCostItem
    ActualCost_MVO:
      allOf:
        - $ref: '#/components/schemas/Cost_MVO'
        - type: object
          description: 'Concrete implementation of Cost, as ActualCost'
          properties:
            state:
              $ref: '#/components/schemas/ActualCostStateType'
            period:
              $ref: '#/components/schemas/TimePeriod'
            actualCostItem:
              type: array
              description: A list of Actual Cost Items items which are part of the overall Actual cost
              items:
                $ref: '#/components/schemas/ActualCostItem'
          required:
            - actualCostItem
    ActualCost_RES:
      type: object
      description: Response object for ActualCost
      allOf:
        - $ref: '#/components/schemas/ActualCost'
      required:
        - id
        - href
    ActualCostAttributeValueChangeEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: ActualCostAttributeValueChangeEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/ActualCostAttributeValueChangeEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          ActualCostAttributeValueChangeEvent: '#/components/schemas/ActualCostAttributeValueChangeEvent'
    ActualCostAttributeValueChangeEventPayload:
      type: object
      description: ActualCostAttributeValueChangeEventPayload generic structure
      properties:
        actualCost:
          $ref: '#/components/schemas/ActualCost'
    ActualCostCreateEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: ActualCostCreateEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/ActualCostCreateEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          ActualCostCreateEvent: '#/components/schemas/ActualCostCreateEvent'
    ActualCostCreateEventPayload:
      type: object
      description: ActualCostCreateEventPayload generic structure
      properties:
        actualCost:
          $ref: '#/components/schemas/ActualCost'
    ActualCostDeleteEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: ActualCostDeleteEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/ActualCostDeleteEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          ActualCostDeleteEvent: '#/components/schemas/ActualCostDeleteEvent'
    ActualCostDeleteEventPayload:
      type: object
      description: ActualCostDeleteEventPayload generic structure
      properties:
        actualCost:
          $ref: '#/components/schemas/ActualCost'
    ActualCostItem:
      allOf:
        - $ref: '#/components/schemas/CostItem'
        - type: object
          description: 'Concrete implementation of CostItem, as ActualCostItem'
          properties:
            state:
              $ref: '#/components/schemas/ActualCostItemStateType'
            period:
              $ref: '#/components/schemas/TimePeriod'
    ActualCostItem_FVO:
      allOf:
        - $ref: '#/components/schemas/CostItem_FVO'
        - type: object
          description: 'Concrete implementation of CostItem, as ActualCostItem'
          properties:
            state:
              $ref: '#/components/schemas/ActualCostItemStateType'
            period:
              $ref: '#/components/schemas/TimePeriod'
          required:
            - name
    ActualCostItemStateType:
      enum:
        - incurred
        - disputed
        - verified
        - allocated
        - cancelled
      type: string
      description: Possible values for the state of the actual cost item.
    ActualCostStateChangeEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          description: ActualCostStateChangeEvent generic structure
          properties:
            event:
              $ref: '#/components/schemas/ActualCostStateChangeEventPayload'
      discriminator:
        propertyName: '@type'
        mapping:
          ActualCostStateChangeEvent: '#/components/schemas/ActualCostStateChangeEvent'
    ActualCostStateChangeEventPayload:
      type: object
      description: ActualCostStateChangeEventPayload generic structure
      properties:
        actualCost:
          $ref: '#/components/schemas/ActualCost'
    ActualCostStateType:
      enum:
        - inProgress
        - pendingAllocation
        - allocated
        - cancelled
      type: string
      description: Possible values for the state of the actual cost.
    Addressable:
      type: object
      description: Base schema for addressable entities
      properties:
        href:
          type: string
          description: Hyperlink reference
        id:
          type: string
          description: unique identifier
    Attachment:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          description: >-
            Complements the description of an element (for instance a product) through video,
            pictures...
          properties:
            name:
              type: string
              description: The name of the attachment
            description:
              type: string
              description: A narrative text describing the content of the attachment
              example: Photograph of the Product
            url:
              type: string
              description: 'Uniform Resource Locator, is a web page address (a subset of URI)'
              example: 'https://host/Content/4aafacbd-11ff-4dc8-b445-305f2215715f'
            content:
              type: string
              format: base64
              description: 'The actual contents of the attachment object, if embedded, encoded as base64'
            size:
              $ref: '#/components/schemas/Quantity'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
            attachmentType:
              type: string
              description: >-
                a business characterization of the purpose of the attachment, for example logo,
                instructionManual, contractCopy
            mimeType:
              type: string
              description: a technical characterization of the attachment content format using IETF Mime Types
      discriminator:
        propertyName: '@type'
        mapping:
          Attachment: '#/components/schemas/Attachment'
    Attachment_FVO:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          description: >-
            Complements the description of an element (for instance a product) through video,
            pictures...
          properties:
            name:
              type: string
              description: The name of the attachment
            description:
              type: string
              description: A narrative text describing the content of the attachment
              example: Photograph of the Product
            url:
              type: string
              description: 'Uniform Resource Locator, is a web page address (a subset of URI)'
              example: 'https://host/Content/4aafacbd-11ff-4dc8-b445-305f2215715f'
            content:
              type: string
              format: base64
              description: 'The actual contents of the attachment object, if embedded, encoded as base64'
            size:
              $ref: '#/components/schemas/Quantity'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
            attachmentType:
              type: string
              description: >-
                a business characterization of the purpose of the attachment, for example logo,
                instructionManual, contractCopy
            mimeType:
              type: string
              description: a technical characterization of the attachment content format using IETF Mime Types
          required:
            - attachmentType
            - mimeType
      discriminator:
        propertyName: '@type'
        mapping:
          Attachment: '#/components/schemas/Attachment_FVO'
    AttachmentRef:
      allOf:
        - $ref: '#/components/schemas/EntityRef'
        - type: object
          description: >-
            Attachment reference. An attachment complements the description of an element (for
            instance a product) through video, pictures
          properties:
            description:
              type: string
              description: A narrative text describing the content of the attachment
            url:
              description: Link to the attachment media/content
              type: string
      discriminator:
        propertyName: '@type'
        mapping:
          AttachmentRef: '#/components/schemas/AttachmentRef'
    AttachmentRefOrValue:
      type: object
      description: >-
        The polymorphic attributes @type, @schemaLocation & @referredType are related to the
        Attachment entity and not the AttachmentRefOrValue class itself
      oneOf:
        - $ref: '#/components/schemas/Attachment'
        - $ref: '#/components/schemas/AttachmentRef'
      discriminator:
        propertyName: '@type'
        mapping:
          Attachment: '#/components/schemas/Attachment'
          AttachmentRef: '#/components/schemas/AttachmentRef'
    AttachmentRefOrValue_FVO:
      type: object
      description: >-
        The polymorphic attributes @type, @schemaLocation & @referredType are related to the
        Attachment entity and not the AttachmentRefOrValue class itself
      oneOf:
        - $ref: '#/components/schemas/Attachment_FVO'
        - $ref: '#/components/schemas/AttachmentRef'
      discriminator:
        propertyName: '@type'
        mapping:
          Attachment: '#/components/schemas/Attachment_FVO'
          AttachmentRef: '#/components/schemas/AttachmentRef'
    BaseEvent:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          description: Base event with common attributes.
