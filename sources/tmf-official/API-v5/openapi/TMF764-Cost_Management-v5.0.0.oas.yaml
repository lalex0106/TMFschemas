openapi: 3.0.1
info:
  title: Cost Management
  description: >-
    The Cost Management API provides standardised mechnasim for creating cost instance with all the
    necessary cost attributes. The API consists of a simple set of operations that can interact with
    various systems in the ODA Core Commerce Management (CCM) and Production functional blocks.
    There are two types of costs defined in the Cost Management API; actual costs and projected
    costs.
  version: 5.0.0
  x-generation-tooling-version: v8.5.8
  x-generation-data-model-version: unknown
servers:
  - url: '{apiRoot}/tmf-api/costManagement/v5'
    variables:
      apiRoot:
        default: 'https://serverRoot'
        enum:
          - 'https://serverRoot'
tags:
  - name: actualCost
    description: Operations for ActualCost Resource
  - name: projectedCost
    description: Operations for ProjectedCost Resource
  - name: notification listener
    description: Notifications for Resource Lifecycle and event notifications
  - name: events subscription
    description: Endpoints to register and terminate an Event Listener
