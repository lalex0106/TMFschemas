components:
  schemas:
    AccumulatedBalance:
      allOf:
        - $ref: '#/components/schemas/Entity'
        - description: >-
            Represents and tracks the aggregated amount remained or owed in certain account which is
            owned by certain customer for a set of buckets.
          properties:
            bucket:
              type: array
              items:
                $ref: '#/components/schemas/BucketRef'
              description: A reference to the buckets involved in the aggregation
            logicalResource:
              type: array
              items:
                $ref: '#/components/schemas/LogicalResourceRef'
            description:
              type: string
              description: Text describing the contents of the aggregated balance
            name:
              type: string
              description: Friendly name to identify the aggregated balance
            partyAccount:
              $ref: '#/components/schemas/PartyAccountRef'
            product:
              type: array
              items:
                $ref: '#/components/schemas/ProductRef'
              description: >-
                A reference to the product whose consumption is managed by the bucket . This is an
                array to allow scenarios where a buckets are shared between different products
            relatedParty:
              type: array
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
              description: >-
                Used to provide information about any other entity with relation to the balance, for
                instance to define customer hierarchy for the balance (e.g.: customerId, userId, )
            totalBalance:
              type: array
              items:
                $ref: '#/components/schemas/Quantity'
              minItems: 1
      discriminator:
        propertyName: '@type'
        mapping:
          AccumulatedBalance: '#/components/schemas/AccumulatedBalance'
